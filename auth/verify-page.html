<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Substack Analyzer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Source Sans 3', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #FFFBF7 0%, #fff 100%);
            padding: 24px;
        }
        .card {
            text-align: center;
            max-width: 480px;
            background: #fff;
            padding: 48px 40px;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        .icon { font-size: 64px; margin-bottom: 24px; }
        h1 {
            font-family: 'Lora', serif;
            font-size: 28px;
            color: #111827;
            margin-bottom: 16px;
        }
        p {
            font-size: 18px;
            color: #6B7280;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .token-box {
            background: #F3F4F6;
            border: 2px solid #E5E7EB;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            word-break: break-all;
            font-family: monospace;
            font-size: 14px;
            color: #374151;
        }
        button {
            background: #FF6719;
            color: #fff;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover { background: #E55A15; }
        .copied {
            background: #28a745;
        }
        .note {
            margin-top: 20px;
            font-size: 14px;
            color: #9CA3AF;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🔐</div>
        <h1>Almost there!</h1>
        <p>Copy this login token and paste it into the Substack Analyzer extension.</p>
        <div class="token-box" id="token"></div>
        <button id="copy-btn" onclick="copyToken()">Copy Token</button>
        <p class="note">This token expires in 15 minutes.</p>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token') || 'No token found';
        document.getElementById('token').textContent = token;
        
        function copyToken() {
            navigator.clipboard.writeText(token);
            const btn = document.getElementById('copy-btn');
            btn.textContent = 'Copied!';
            btn.classList.add('copied');
            setTimeout(() => {
                btn.textContent = 'Copy Token';
                btn.classList.remove('copied');
            }, 2000);
        }
    </script>
</body>
</html>
