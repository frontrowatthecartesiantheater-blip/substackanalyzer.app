<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Cancelled – Substack Analyzer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Source Sans 3', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #FFFBF7 0%, #fff 100%);
            padding: 24px;
        }
        .card {
            text-align: center;
            max-width: 440px;
            background: #fff;
            padding: 48px 40px;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        .icon { font-size: 64px; margin-bottom: 24px; }
        h1 {
            font-family: 'Lora', serif;
            font-size: 28px;
            color: #111827;
            margin-bottom: 16px;
        }
        p {
            font-size: 18px;
            color: #6B7280;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        a {
            display: inline-block;
            padding: 12px 24px;
            background: #FF6719;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            border-radius: 8px;
        }
        a:hover { background: #E55A15; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">↩️</div>
        <h1>Payment Cancelled</h1>
        <p>No worries — you weren't charged. You can add credits anytime from the extension.</p>
        <a href="/">Back to Home</a>
    </div>
</body>
</html>
